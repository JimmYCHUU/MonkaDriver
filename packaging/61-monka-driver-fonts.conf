<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Font aliases for the Monka Driver UI. The vendor bundle asks for Apple's
     PingFang SC (with the weight encoded in the family name), Roboto and Menlo,
     none of which exist on Fedora; map them to installed metric-friendly fonts. -->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFang-SC-Bold</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFangSC-Bold</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFangSC-bold</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFangSC-bolc</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFang-SC-Regular</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>PingFangSC-Regular</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <alias binding="same">
    <family>Roboto</family>
    <prefer><family>Liberation Sans</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Roboto-Regular</family>
    <prefer><family>Liberation Sans</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>HelveticaNeue</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Menlo</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
